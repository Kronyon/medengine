*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--f-body);line-height:1.55;display:flex;align-items:center;justify-content:center;padding:32px 16px}
main{width:100%;max-width:820px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.bill{width:44px;height:44px;border-radius:12px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.5rem}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.8rem,5vw,2.6rem);letter-spacing:-.02em;margin:0;line-height:1}
h1 .ext{font-family:var(--f-mono);font-size:.62em;font-weight:700;color:var(--muted)}
.ver{font-family:var(--f-mono);font-size:.78rem;border:1px solid var(--line);border-radius:99px;padding:2px 9px;color:var(--muted);margin-left:auto;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
a.app{display:flex;flex-direction:column;gap:14px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px 24px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .15s ease,border-color .15s ease}
a.app::before{content:"";position:absolute;inset:0 0 auto;height:5px;background:var(--c)}
a.app:hover{transform:translateY(-2px);border-color:var(--c)}
a.app:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.osce{--c:var(--osce);--soft:var(--osce-soft);--cink:var(--osce-ink)}
.study{--c:var(--study);--soft:var(--study-soft);--cink:var(--study-ink)}
.tag{align-self:flex-start;font-family:var(--f-mono);font-size:.72rem;font-weight:700;letter-spacing:.06em;background:var(--soft);color:var(--cink);border-radius:99px;padding:3px 10px}
a.app h2{font-family:var(--f-display);font-size:1.85rem;font-weight:800;margin:0;letter-spacing:-.02em}
a.app h2 span{color:var(--cink)}
.go{margin-top:auto;padding-top:6px;font-weight:700;color:var(--cink);display:flex;justify-content:space-between;align-items:center}
kbd{font-family:var(--f-mono);font-size:.75rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 7px;color:var(--muted)}
@media (hover:none){kbd{display:none}}
button.theme{font:inherit;font-size:.82rem;background:none;border:1px solid var(--line);border-radius:99px;padding:4px 12px;color:var(--muted);cursor:pointer}

<body>
<main>
  <div class="top">
    <div class="bill" aria-hidden="true">m</div>
    <h1>medengine<span class="ext">.exe</span></h1>
    <span class="ver">v3.3.1</span>
    <button class="theme" id="theme" type="button">◐ Theme</button>
  </div>

  <div class="grid">
    <a class="app osce" id="osce" href="osce.html">
      <span class="tag">🩺 OSCE</span>
      <h2>OSCE</h2>
      <div class="go">Launch → <kbd>1</kbd></div>
    </a>
    <a class="app study" id="study" href="study.html">
      <span class="tag">🧠 STUDY</span>
      <h2>STUDY</h2>
      <div class="go">Launch → <kbd>2</kbd></div>
    </a>
  </div>
  <p class="edu">For education only, not medical advice. Check anything you act on against current UK guidance.</p>
</main>
<script>
document.addEventListener('keydown', function (e) {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  var t = e.key === '1' ? 'osce' : e.key === '2' ? 'study' : null;
  if (t) location.href = document.getElementById(t).href;
});
(function () {
  var r = document.documentElement, k = 'medengine-launcher-theme', btn = document.getElementById('theme');
  try { var s = localStorage.getItem(k); if (s) r.dataset.theme = s; } catch (e) {}
  function isDark() { return r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; }
  function sync() { if (btn) btn.textContent = isDark() ? '🌙 Dark mode' : '☀️ Light mode'; }
  sync();
  btn.addEventListener('click', function () {
    r.dataset.theme = isDark() ? 'light' : 'dark';
    try { localStorage.setItem(k, r.dataset.theme); } catch (e) {}
    sync();
  });
  window.addEventListener('storage', function (e) {
    if (e && e.key === k && (e.newValue === 'light' || e.newValue === 'dark')) { r.dataset.theme = e.newValue; sync(); }
    else if (e && e.key === 'medengine-cosmetics' && e.newValue) {
      try {
        var c = JSON.parse(e.newValue);
        if (c.skin && c.skin !== 'default') r.dataset.skin = c.skin; else delete r.dataset.skin;
        if (c.cursor && c.cursor !== 'default') r.dataset.cursor = c.cursor; else delete r.dataset.cursor;
      } catch (er) {}
    }
  });
})();
</script>
</body>
