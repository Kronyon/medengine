<title>medengine-OSCE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: sticky station bar + one work surface. Sister app to the Drill: same type family, scrubs-teal instead of highlighter yellow. */
:root{
  --bg:#edf3f2; --surface:#ffffff; --surface-2:#f4f8f7; --ink:#10242a; --muted:#536770; --line:#d4e1df;
  --accent:#0e8f7e; --accent-2:#0b7466; --accent-soft:#d6f0eb; --accent-ink:#06594e; --on-accent:#ffffff;
  --good:#16865a; --good-soft:#dcf3e8; --warn:#b26a00; --warn-soft:#fdf0d8; --bad:#c93a3a; --bad-soft:#fbe3e3; --focus:#2f6fed;
  --drill:#ffc21a; --shadow:0 1px 2px rgba(16,36,42,.06),0 4px 14px rgba(16,36,42,.07);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Verdana","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1517; --surface:#13201f; --surface-2:#182826; --ink:#e5f0ee; --muted:#93aaa6; --line:#24393a;
  --accent:#3cc7b2; --accent-2:#5fd8c5; --accent-soft:#123a35; --accent-ink:#8fe8da; --on-accent:#05211d;
  --good:#3ccf8e; --good-soft:#123527; --warn:#f0b04a; --warn-soft:#3a2a10; --bad:#ff7070; --bad-soft:#3b1a1d; --focus:#7aa6ff;
  --drill:#ffcb3d; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1517; --surface:#13201f; --surface-2:#182826; --ink:#e5f0ee; --muted:#93aaa6; --line:#24393a;
  --accent:#3cc7b2; --accent-2:#5fd8c5; --accent-soft:#123a35; --accent-ink:#8fe8da; --on-accent:#05211d;
  --good:#3ccf8e; --good-soft:#123527; --warn:#f0b04a; --warn-soft:#3a2a10; --bad:#ff7070; --bad-soft:#3b1a1d; --focus:#7aa6ff;
  --drill:#ffcb3d; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:var(--accent-ink)}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:1.55rem;font-weight:800;line-height:1.15}
h2{font-size:1.15rem;font-weight:800}
h3{font-size:1rem;font-weight:700}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.bar{display:flex;align-items:center;gap:10px;max-width:980px;margin:0 auto}
.brand{display:flex;align-items:center;gap:8px;border:0;background:none;padding:0;font-family:var(--f-display);font-weight:800;font-size:1.05rem;white-space:nowrap}
.brand .ext{font-family:var(--f-mono);font-weight:700;font-size:.82em;color:var(--accent-ink)}
.brand .ver{font-family:var(--f-mono);font-size:.6rem;font-weight:700;padding:1px 5px;border-radius:5px;background:var(--accent-soft);color:var(--accent-ink);align-self:center}
@media (max-width:420px){.brand .ver{display:none}}
.brand .bill{width:26px;height:26px;border-radius:50% 50% 50% 12%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:.8rem;transform:rotate(-8deg)}
.switch{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 4px;font-size:.8rem;font-weight:700;text-decoration:none;color:var(--ink);background:var(--surface-2);white-space:nowrap}
.switch .dot{width:18px;height:18px;border-radius:50%;background:var(--drill);display:grid;place-items:center;font-size:.6rem;color:#3d2a00;font-weight:800}
.grow{flex:1}
.search{width:100%;max-width:280px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 14px;outline:none;min-width:0}
.search:focus{border-color:var(--accent)}
.nav{display:flex;gap:2px;max-width:980px;margin:8px auto 0;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{border:0;background:none;padding:8px 12px 10px;font-weight:700;font-size:.9rem;color:var(--muted);white-space:nowrap;border-bottom:3px solid transparent}
.nav button.on{color:var(--ink);border-bottom-color:var(--accent)}
main{max-width:980px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 80px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.hint{font-size:.85rem;color:var(--muted)}
.eyebrow{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.code{font-family:var(--f-mono);font-size:.72rem;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent-ink);white-space:nowrap}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:700;font-size:.9rem;display:inline-flex;gap:6px;align-items:center;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-2)}
.btn.sm{padding:5px 10px;font-size:.8rem}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;font-size:.85rem;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--on-accent)}
select.sel{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;max-width:100%;min-width:0}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.li:hover{border-color:var(--accent)}
.li .tt{flex:1;min-width:0}
.li .tt b{display:block;font-weight:700}
.li .tt span{display:block;font-size:.82rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score{font-family:var(--f-mono);font-size:.75rem;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.score.g{background:var(--good-soft);color:var(--good)} .score.w{background:var(--warn-soft);color:var(--warn)} .score.b{background:var(--bad-soft);color:var(--bad)}
.brief{background:var(--surface-2);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.brief p{margin:0}
.task{border-left:4px solid var(--accent);padding-left:10px;font-weight:700}
/* timer */
.timer{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.clock{font-family:var(--f-mono);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;min-width:5ch}
.clock.late{color:var(--warn)} .clock.over{color:var(--bad)}
.track{position:relative;flex:1 1 160px;height:10px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;min-width:120px}
.track i{position:absolute;inset:0 auto 0 0;background:var(--accent);width:0}
.track .zone{position:absolute;inset:0 0 0 80%;background:repeating-linear-gradient(45deg,var(--warn-soft),var(--warn-soft) 4px,transparent 4px,transparent 8px);border-left:2px solid var(--warn)}
.alert{border:1px solid var(--warn);background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:8px 12px;font-weight:700}
/* checklist */
.sec{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.sec>summary{list-style:none;cursor:pointer;padding:10px 12px;display:flex;gap:8px;align-items:center;font-weight:700}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::after{content:'▸';color:var(--muted);margin-left:4px}
.sec[open]>summary::after{content:'▾'}
.sec[open]>summary{border-bottom:1px dashed var(--line)}
.sec .cnt{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);margin-left:auto}
.items{display:flex;flex-direction:column;padding:4px 6px 8px}
.it{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:4px 8px;align-items:start;padding:7px 6px;border-radius:8px}
.it:hover{background:var(--surface-2)}
.it input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent)}
.it label{cursor:pointer;line-height:1.4}
.it .crit{font-family:var(--f-mono);font-size:.62rem;font-weight:700;color:var(--bad);border:1px solid var(--bad);border-radius:5px;padding:0 4px;margin-left:6px;vertical-align:1px}
.it .fb{font-family:var(--f-mono);font-size:.62rem;font-weight:700;color:var(--warn);border:1px solid var(--warn);border-radius:5px;padding:0 4px;margin-left:6px;vertical-align:1px}
.it .more{border:0;background:none;color:var(--muted);font-size:.85rem;padding:0 4px}
.it .xp{grid-column:2/4;font-size:.88rem;display:flex;flex-direction:column;gap:3px;padding:2px 0 4px}
.it .say{color:var(--accent-ink)} .it .tip{color:var(--muted)}
.it.ai{background:var(--accent-soft)}
.it.miss label{color:var(--bad)}
.pct{font-family:var(--f-display);font-weight:800;font-size:2rem;line-height:1}
.pctbar{height:8px;border-radius:9px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.pctbar i{display:block;height:100%;background:var(--accent)}
.stick{position:sticky;top:calc(env(safe-area-inset-top,0px) + 98px);z-index:20}
/* chat */
.chat{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow-y:auto;padding:4px 2px}
.msg{max-width:88%;padding:8px 12px;border-radius:14px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px}
.msg.pt{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.ex{align-self:flex-start;background:var(--warn-soft);border:1px solid var(--warn);border-bottom-left-radius:4px}
.msg .who{display:block;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;opacity:.75;margin-bottom:2px}
.compose{display:flex;gap:8px;align-items:flex-end}
.compose textarea{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:9px 12px;resize:vertical;min-height:44px;max-height:160px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px dashed var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:.78rem;color:var(--muted)}
.fbk{display:flex;flex-direction:column;gap:6px}
.fbk h3{margin-top:4px}
.fbk ul{margin:0;padding-left:20px}
/* learn */
.dd{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.dd>summary{list-style:none;cursor:pointer;padding:9px 12px;font-weight:700}
.dd>summary::-webkit-details-marker{display:none}
.dd[open]>summary{border-bottom:1px dashed var(--line)}
.dd .body{padding:8px 12px 12px;display:flex;flex-direction:column;gap:6px}
.step{display:flex;flex-direction:column;gap:2px;padding:6px 0;border-bottom:1px dashed var(--line)}
.step:last-child{border-bottom:0}
.step .say{color:var(--accent-ink);font-size:.9rem} .step .tip{color:var(--muted);font-size:.88rem}
.pack li{margin:2px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:.8rem;font-weight:700;color:var(--ink);text-decoration:none}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;min-width:0}
.tile:hover{border-color:var(--accent)}
.tile b{font-family:var(--f-display);font-size:1.05rem}
.prio{display:grid;grid-template-columns:26px minmax(0,1fr);gap:4px 10px;align-items:start}
.prio .n{font-family:var(--f-mono);font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border-radius:8px;text-align:center;padding:2px 0}
.empty{color:var(--muted);text-align:center;padding:20px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(120%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:10px;font-weight:700;transition:transform .2s;z-index:90;max-width:calc(100% - 32px)}
.toast{opacity:0;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
/* v2: hooks, script, friends */
.src{font-size:.78rem;color:var(--muted)}
.hk{border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:10px;background:var(--surface)}
.hk>summary{list-style:none;cursor:pointer;padding:10px 12px;font-weight:700;display:flex;gap:8px;align-items:center}
.hk>summary::-webkit-details-marker{display:none}
.hk[open]>summary{border-bottom:1px dashed var(--line)}
.hk .body{padding:8px 12px 12px;display:flex;flex-direction:column;gap:8px}
.hkr{display:grid;grid-template-columns:24px minmax(0,1fr);gap:2px 8px;align-items:start;line-height:1.45}
.hkr .i{text-align:center}
.hkh{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.money{background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:10px 12px;border-left:4px solid var(--accent)}
.money>b:first-child{display:block;font-family:var(--f-mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:2px}.money b{color:var(--accent-ink)}
.scr{display:flex;flex-direction:column;gap:8px}
.sl{display:grid;grid-template-columns:30px minmax(0,1fr);gap:2px 10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.sl .n{font-family:var(--f-mono);font-size:.72rem;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border-radius:7px;text-align:center;padding:2px 0;height:max-content}
.sl .sec{font-family:var(--f-mono);font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sl .say{font-size:1.02rem;line-height:1.45;color:var(--ink)}
.sl .say.do{color:var(--muted);font-style:italic}
.sl .why{font-size:.88rem;color:var(--muted)}
.sl.var{border-left:4px solid var(--accent)}
.sl .rev{border:1px dashed var(--line);background:var(--surface-2);border-radius:8px;padding:6px 10px;text-align:left;color:var(--muted);font-size:.9rem;width:100%}
.lik{display:grid;grid-template-columns:minmax(0,1fr) 76px;gap:6px 10px;align-items:start;padding:10px 0;border-bottom:1px dashed var(--line)}
.lik:last-child{border-bottom:0}
.lik ul{margin:4px 0 0;padding-left:18px;font-size:.88rem;color:var(--muted)}
.lik ul b{color:var(--ink)}
.lik select{width:76px;text-align:center}
.role{background:var(--surface-2);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.ac-r{display:grid;grid-template-columns:minmax(84px,30%) 1fr;gap:4px 10px;padding:4px 0;border-top:1px dashed var(--line);font-size:.92rem}.ac-r b{font-weight:700}.ac-r span{overflow-wrap:anywhere}
.ac-open{margin:0;padding:8px 10px;border-left:3px solid var(--accent);background:var(--surface);border-radius:8px;font-weight:600}
.ac-p{margin:0}
.role ul{margin:0;padding-left:20px}
.flash{min-height:260px;justify-content:space-between}
.flash .front{font-family:var(--f-display);font-weight:800;font-size:1.12rem;line-height:1.35}
.flash .back{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.mk{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:8px}
.mk div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.mk b{display:block}
.dx{font-weight:700;color:var(--accent-ink)}
@media (max-width:620px){
  .search{display:none}
  .bar{flex-wrap:wrap}
  .search.show{display:block;max-width:none;flex:1 1 100%;order:9;margin-top:2px}
  h1{font-size:1.3rem}
  .stick{top:calc(env(safe-area-inset-top,0px) + 96px)}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.fw{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;background:var(--surface)}
.fw>summary{list-style:none;cursor:pointer;padding:10px 12px;font-weight:700;display:flex;gap:6px 8px;align-items:center;flex-wrap:wrap}
.fw>summary::-webkit-details-marker{display:none}
.fw[open]>summary{border-bottom:1px dashed var(--line)}
.fw .body{padding:8px 12px 12px;display:flex;flex-direction:column;gap:8px}
.nn{font-family:var(--f-mono);font-size:.62rem;font-weight:700;color:var(--bad);background:var(--bad-soft);border-radius:5px;padding:1px 5px;margin-right:4px;vertical-align:1px;white-space:nowrap}
.skel{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:.78rem}
.skel span{border:1px solid var(--line);border-radius:999px;padding:2px 8px;background:var(--surface-2);color:var(--muted)}
.skel span.x{border-color:var(--bad);color:var(--bad)}
.skel span.c{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.fst{display:grid;grid-template-columns:30px minmax(0,1fr);gap:2px 10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.fst .n{font-family:var(--f-mono);font-size:.72rem;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border-radius:7px;text-align:center;padding:2px 0;height:max-content}
.fst.x{border-left:4px solid var(--bad)}
.fst .say{line-height:1.45}
.fst .why{font-size:.86rem;color:var(--muted)}
.fst.dim .say,.fst.dim .why{display:none}
.chg{margin-top:4px;background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:8px;padding:6px 10px;font-size:.92rem;line-height:1.45}
.chg b{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);display:block}
.same{font-size:.78rem;color:var(--muted);font-style:italic}
.tree{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:6px}
.tree .br{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface)}
.tree .br b{display:block;font-size:.86rem}
.tree .lv{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tree .lv span{font-size:.78rem;border-radius:999px;padding:2px 8px;background:var(--surface-2);border:1px solid var(--line)}
.nnr{display:grid;grid-template-columns:24px minmax(0,1fr);gap:2px 8px;line-height:1.45}
.nnr .k{font-family:var(--f-mono);font-size:.7rem;font-weight:700;color:var(--bad);text-align:center;padding-top:2px}
