const FWD = D.fw || {uni: [], list: []}, FWL = FWD.list, UNI = FWD.uni, FWBY = {}; FWL.forEach(f => FWBY[f.id] = f);

/* ---------- checklist assembly ---------- */
const ORDER = ['hx', 'mhx', 'ex', 'proc', 'di', 'presc', 'counsel', 'bbn', 'expl', 'acute', 'prof', 'sbar', 'ebm', 'reason', 'plan', 'pres'];
function packFor(st){ for (const ui of st.u || []) if (PK[ui]) return {p: PK[ui], u: UNITS[ui]}; return null; }
const frameItems = fid => { const f = FR[fid]; const out = []; if (f) f.secs.forEach(sc => sc.items.forEach(it => out.push(Object.assign({sub: sc.h}, it)))); return out; };
function varOf(st, vk){ if (!(st.vars || []).length) return null; return st.vars.find(v => v.k === vk) || st.vars[0]; }
function splitX(x){ return x.split(/;\s+|\.\s+(?=[A-Z])/).map(t => t.trim().replace(/\.$/, '')).filter(t => t.length > 3); }
function caseSecs(st, vk, add){
  const c = caseOf(st, vk); if (!c) return false;
  const ex = isExCase(st, c);
  add('ck', ex ? 'This case: what the examiner looks for' : 'This case: what to ask', c.key.map(([say, why]) => ({t: say.replace(/[?.]$/, ''), why, say: ex ? '' : say, sub: 'Station-specific'})).concat(c.rf.map(([say, why]) => ({t: 'Red flag: ' + say.replace(/[?.]$/, ''), say, why, w: 2, sub: 'Red flags'}))), true);
  const p = [];
  if (c.sum) p.push({t: 'Summarises back to the patient and checks', say: c.sum, f: 1});
  p.push({t: 'Presents with a headline, key positives and important negatives', say: c.pres, w: 2, f: 1});
  ddxRows(c).forEach(([h, t], i) => p.push({t: h + ': ' + t, w: i === 0 ? 2 : 1}));
  if (c.ix) p.push({t: 'Investigations in order: ' + c.ix});
  if (c.mx) p.push({t: 'Management with urgency: ' + c.mx, f: 1});
  if (c.tell) p.push({t: 'Explains the plan and safety-nets in plain words', say: c.tell, w: 2});
  add('cp', 'Present, differentials and next steps', p);
  return true;
}
function buildChecklist(st, vk){
  const secs = [];
  const add = (key, h, items, open) => { if (items.length) secs.push({key, h, items: items.map((it, n) => Object.assign({id: key + '.' + n}, it)), open}); };
  if (st.secs) {
    const w = st.wrap || ['open', 'close'];
    add(w[0], FR[w[0]].t, frameItems(w[0]));
    st.secs.forEach((sc, i) => add('s' + i, sc.h, sc.items, i === 0));
    const v = varOf(st, vk); if (!caseSecs(st, vk, add) && v && v.x) add('vx', 'This case: what the examiner wants', splitX(v.x).map(t => ({t})));
    add(w[1], FR[w[1]].t, frameItems(w[1]));
    return secs;
  }
  add('open', 'Opening', frameItems('open'));
  if (st.pp) {
    st.dom.forEach((d, i) => add('d' + i, d.h, d.items, i === 0));
    const v = varOf(st, vk); if (!caseSecs(st, vk, add) && v && v.x) add('vx', 'This case: what the examiner wants', splitX(v.x).map(t => ({t})));
    add(closeKey(st), 'Closing', frameItems(closeKey(st)));
    return secs;
  }
  const pk = packFor(st), fr = ORDER.filter(f => (st.fr || []).includes(f));
  const hasExpl = fr.some(f => ['expl', 'counsel', 'bbn'].includes(f)), hasCase = !!caseOf(st, vk);
  fr.forEach(f => {
    if (hasCase && (f === 'pres' || f === 'reason')) return;
    if (f === 'hx' || f === 'mhx') {
      add(f, FR[f].t, frameItems(f));
      if (caseOf(st, vk)) { caseSecs(st, vk, add); return; }
      if (pk) add('cx', pk.u.name + ': what to ask', (pk.p.hx || []).slice(0, 7).map(t => ({t: 'Asks: ' + t, sub: 'Discriminating questions'})).concat((pk.p.rf || []).slice(0, 4).map(t => ({t: 'Screens red flag: ' + t, w: 2, sub: 'Red flags'}))));
    } else if (f === 'ex') {
      add('ex', 'Examination: core', frameItems('ex'));
      (st.ex || []).forEach(eid => { const e = exById[eid]; if (!e) return; const items = []; e.secs.forEach(sc => sc.items.forEach(it => items.push(Object.assign({sub: sc.h}, it)))); add('e_' + eid, e.t, items, true); });
      if (!(st.ex || []).length && pk) add('cxe', pk.u.name + ': what to look for', (pk.p.ex || []).map(t => ({t: 'Looks for: ' + t})));
    } else if (f === 'proc') {
      add('proc', 'Procedure: core', frameItems('proc'));
      (st.pr || []).forEach(pid => { const p = prById[pid]; if (!p) return; const items = []; p.secs.forEach(sc => sc.items.forEach(it => items.push(Object.assign({sub: sc.h}, it)))); add('p_' + pid, p.t, items, true); });
    } else if (f === 'reason') {
      const items = frameItems('reason'); if (!st.gen) items.unshift({t: 'Names the working diagnosis or key problem: ' + st.t, w: 2, f: 1});
      add('reason', 'Clinical reasoning made visible', items);
    } else if (f === 'plan') {
      add('plan', 'Management plan: core', frameItems('plan'));
      if (pk) add('cxm', pk.u.name + ': investigations and management (UK)', (pk.p.ix || []).slice(0, 4).map(t => ({t: 'Investigation: ' + t, sub: 'Investigations'})).concat((pk.p.mx || []).slice(0, 5).map(t => ({t: 'Management: ' + t, sub: 'Management', f: 1}))));
    } else if (f === 'expl' || f === 'counsel' || f === 'bbn') {
      add(f, FR[f].t, frameItems(f));
      if (pk && f !== 'counsel') { const it = []; (pk.p.say || []).forEach(t => it.push({t: 'Explains in plain words, e.g. ' + t, sub: 'Explanation'})); (pk.p.ice || []).slice(0, 1).forEach(t => it.push({t: 'Addresses the likely concern: ' + t, w: 2, sub: 'Concern'})); (pk.p.sn || []).slice(0, 2).forEach(t => it.push({t: 'Safety-nets: ' + t, sub: 'Safety-net'})); add('cxx', pk.u.name + ': explanation points', it); }
    } else add(f, FR[f].t, frameItems(f));
  });
  add(closeKey(st), 'Closing', frameItems(closeKey(st)).filter(it => !(hasExpl && /^(Check understanding|Safety-net)/.test(it.t))));
  return secs;
}
function pctOf(secs, ticks){ let tot = 0, got = 0; secs.forEach(sc => sc.items.forEach(it => { const w = it.w || 1; tot += w; if (ticks.has(it.id)) got += w; })); return tot ? Math.round(got * 100 / tot) : 0; }
function stationForExam(eid){ const e = exById[eid]; return ST.find(s => !s.pp && (s.ex || []).includes(eid)) || {id: 'E-' + eid, g: 'EX', k: 'Examination and findings', t: e.t, info: 'Practise the full examination on a friend or model, narrating each step.', task: 'Examine, present your findings, and say what you would do to complete the assessment.', u: e.u, fr: ['ex', 'reason', 'plan'], ex: [eid], pr: [], gen: 1}; }
function stationForProc(pid){ const p = prById[pid]; return ST.find(s => !s.pp && (s.pr || []).includes(pid)) || {id: 'P-' + pid, g: 'PC', k: 'Practical task and completion', t: p.t, info: 'Practise on a model, narrating each step.', task: 'Perform the procedure safely, explain it to the patient, and complete documentation.', u: p.u, fr: ['proc', 'expl'], ex: [], pr: [pid], gen: 1}; }
function getStation(id){ if (stById[id]) return stById[id]; if (id.startsWith('E-') && exById[id.slice(2)]) return stationForExam(id.slice(2)); if (id.startsWith('P-') && prById[id.slice(2)]) return stationForProc(id.slice(2)); return null; }

/* ---------- hooks + script ---------- */
const CKI = {in: '✅', out: '❌', lab: '🧪', nb: '🆕'};
const moneyFor = (st, vk) => (st.mv && st.mv[vk]) || st.money;
function hooksFor(st, vk){
  if (st.secs) return {trig: [], hook: st.hooks || [], clinch: [], money: moneyFor(st, vk), trap: st.traps || [], all: []};
  if (st.pp) return {trig: st.trig, hook: st.hook, clinch: st.clinch, money: moneyFor(st, vk), trap: st.trap, all: st.vars.length > 1 ? st.vars.map(v => [v.k, v.dx, moneyFor(st, v.k)]) : []};
  const ck = [], seen = new Set();
  (st.u || []).forEach(i => (PK[i] && PK[i].ck || []).forEach(c => { if (!seen.has(c[1])) { seen.add(c[1]); ck.push(c); } }));
  return {trig: st.cmp ? [st.cmp] : [], hook: st.def ? [st.def] : [], clinch: ck.slice(0, 6), money: 'The important finding is ___. It suggests ___ because ___. The next step is ___.', trap: []};
}
function hookHtml(h, open){

  if (h.trig.length) b += '<span class="hkh">Door-sign triggers</span>' + h.trig.map(t => row('⚡', t)).join('');

  if (h.money) b += '<div class="money"><b>🎯 Money line</b>' + rich(h.money) + '</div>';
  if (h.money && (h.all || []).length) b += '<details class="dd"><summary>🎯 Money lines for every case · ' + h.all.length + '</summary><div class="body">' + h.all.map(([k, dx, m]) => '<div class="money"><b>Case ' + esc(k) + ' · ' + esc(dx) + '</b>' + rich(m || '') + '</div>').join('') + '</div></details>';
  if (h.trap.length) b += '<span class="hkh">Where marks are lost</span>' + h.trap.map(t => row('⚠️', t)).join('');
  return '<details class="hk" id="hookCard"' + (open ? ' open' : '') + '><summary>🎯 Only remember for this one</summary><div class="body">' + b + '</div></details>';

function skelCardHtml(st){
  const k = SKEL[st.skel]; if (!k) return '';
  return '<details class="hk sk" id="skelCard"><summary>🧱 Skeleton: the same in every ' + esc(k.t.replace(/^Every /, '').toLowerCase()) + ' station</summary><div class="body"><div class="skrow">' + k.chips.map((c, i) => '<span>' + esc(c) + '</span>' + (i < k.chips.length - 1 ? '<i>→</i>' : '')).join('') + '</div>' + k.mn.map(([a, b]) => '<div class="mn"><b>' + esc(a) + '</b><span>' + rich(b) + '</span></div>').join('') + '</div></details>';
}
const URGL = () => Object.entries(URG).map(([k, [e, l]]) => '<span>' + e + ' ' + esc(l) + '</span>').join('');
function rfRows(sh, q){ return sh.rows.filter(r => !q || r.join(' ').toLowerCase().includes(q)).map(([f, th, u, d]) => '<div class="rfr"><span class="u" title="' + esc((URG[u] || ['', ''])[1]) + '">' + (URG[u] || ['•'])[0] + '</span><span><b>' + rich(f) + '</b> → ' + esc(th) + '<span class="s">' + rich(d) + '</span></span></div>').join(''); }
/* v2.6: what to say after the gathering: how to present for this station type, and the management ladder for its ILO week */
function nextCardHtml(st){
  const ty = st.type || '', P = FWBY.present, L = FWBY.plan;
  if (!P || !/^(hx|ex|img|psych)$/.test(ty)) return '';
  const pm = P.m.find(x => x.id === (ty === 'img' ? 'data' : ty === 'ex' ? 'exab' : 'afterhx')); if (!pm) return '';
  const su = st.u || [], wk = su.map(i => UNITS[i] && UNITS[i].w), lm = L ? L.m.find(x => x.u.some(u => su.includes(u))) || L.m.find(x => x.u.some(u => UNITS[u] && wk.includes(UNITS[u].w))) : null;
  let b = '<div class="row"><b class="grow">🎤 Present → ' + esc(pm.t) + '</b><button class="btn sm" data-fw="present" data-fwm="' + pm.id + '">Open ↗</button></div>' + skelHtml(P, pm) + fwDiffHtml(P, pm, false);
  if (lm) b += '<div class="row"><b class="grow">🗺 Plan → ' + esc(lm.t) + '</b><button class="btn sm" data-fw="plan" data-fwm="' + lm.id + '">Open ↗</button></div>' + skelHtml(L, lm) + fwDiffHtml(L, lm, false);

function rfCardHtml(st){
  const L = (st.rf || []).map(id => rfById[id]).filter(Boolean); if (!L.length) return '';

function vRf(m){

  m.innerHTML = '<section class="card"><span class="eyebrow">History stations · UK guidance</span><h1>🚩 Red flags → where to send</h1><p class="hint" style="margin:0">One sheet per presentation, covering every ILO condition. Read across: <b>the flag</b> → what it means, then what you do and how fast. Ask these in every history, then say the referral in your plan.</p><div class="urg">' + URGL() + '</div><input class="sel" id="rfQ" type="search" placeholder="Filter, e.g. dysphagia, 2 weeks, testis" value="' + esc(S.set.rfq || '') + '" aria-label="Filter red flags"></section><div id="rfList">' + rfListHtml(q) + '</div>';

function rfListHtml(q){ const h = RF.map(sh => { const r = rfRows(sh, q); return r ? '<details class="dd"' + (q ? ' open' : '') + '><summary>' + esc(sh.t) + ' <span class="hint">· ' + sh.rows.length + '</span></summary><div class="body">' + r + '</div></details>' : ''; }).join(''); return h || '<p class="hint">Nothing matches.</p>'; }
/* ---------- v2.7 full cases: the patient's script, your verbatim script and checklist, the filled presentation ---------- */
const isExCase = (st, c) => typeOf(st) === 'ex' || (c && c.find && c.find.length > 0);
function caseOf(st, vk){ const v = varOf(st, vk); return v && v.cs ? v.cs : null; }
function ddxRows(c){ return c.ddx && c.ddx.length === 3 ? [['Most likely', c.ddx[0]], ['Common alternative', c.ddx[1]], ['Must not miss', c.ddx[2]]] : []; }
function presLines(c){
  const L = [{s: '🎤 Present', say: c.pres, act: 'Turn to the examiner. Headline, key positives, important negatives.', why: 'Conclusion first, then the evidence for and against. Never narrate the order you did things.', nn: 1}];
  ddxRows(c).forEach(([h, t], i) => L.push({s: '🎤 Differentials', act: h + ': ' + t, why: i === 0 ? 'Every tier carries a because: that is the reasoning mark.' : i === 2 ? 'The dangerous one and how you would exclude it: the safety mark.' : 'The commonest lookalike and the detail that splits them.', nn: i !== 1}));
  if (c.ix) L.push({s: '🧪 Investigations', act: c.ix, why: 'Bedside, then bloods, then imaging, then special. Each test answers a question.'});
  if (c.mx) L.push({s: '🗺 Management', act: c.mx, why: 'Urgency first, then the named first-line treatment and who you would tell.', nn: 1});
  return L;
}
function caseScript(st, v){
  const c = v.cs, L = [], psy = typeOf(st) === 'psych';
  const fl = (fid, label) => frameItems(fid).forEach(it => L.push({s: label, say: it.say || '', act: it.t, why: it.why || '', nn: it.w === 2}));
  if (isExCase(st, c)) {
    const base = scriptFor0(st, v.k).filter(l => !/^Close$/.test(l.s));
    base.forEach(l => L.push(l));
    c.key.forEach(([say, why]) => L.push({s: '🎯 This case: do not miss', act: say, why}));

const JARGON = ['haematemesis', 'melaena', 'dyspnoea', 'dysphagia', 'myocardial', 'infarction', 'ischaemia', 'ischaemic', 'aetiology', 'idiopathic', 'metastas', 'neoplasm', 'malignan', 'pyrexia', 'febrile', 'tachycardi', 'bradycardi', 'oedema', 'haematuria', 'micturition', 'nocturia', 'syncope', 'presyncope', 'orthopnoea', 'paroxysmal', 'hypertension', 'hypotension', 'hyperglycaemi', 'hypoglycaemi', 'contraindicat', 'prophyla', 'differential', 'prognosis', 'bilateral', 'unilateral', 'aneurysm', 'thrombo', 'embol', 'anticoagula', 'antiplatelet', 'sepsis', 'renal', 'hepatic', 'gastric', 'cardiac', 'pulmonary', 'radiat', 'socrates', 'prn', 'nbm', 'iv ', 'ecg', 'ct ', 'mri', 'ogd', 'ercp', 'egfr', 'hba1c'];
function analyse(){
  const me = cur.chat.filter(x => x.role === 'user'), pt = cur.chat.filter(x => x.role === 'assistant');
  const wc = s => (s.match(/[A-Za-z0-9']+/g) || []).length;
  const toPt = me.filter(x => !/^examiner:/i.test(x.content)), toEx = me.filter(x => /^examiner:/i.test(x.content));
  const wMe = me.reduce((n, x) => n + wc(x.content), 0), wPt = pt.reduce((n, x) => n + wc(speakable(x.content)), 0);
  const spoke = me.reduce((n, x) => n + (x.dur || 0), 0);
  const ptText = toPt.map(x => x.content.toLowerCase());
  const open = ptText.reduce((n, s) => n + (s.match(/\b(what|how|tell me|describe|talk me through|in your own words|explain|why)\b/g) || []).length, 0);
  const closed = ptText.reduce((n, s) => n + (s.match(/(^|[.?!,]\s*|\band\s+)(do|does|did|is|are|was|were|have|has|had|any|can|could|would|will)\s+you\b/g) || []).length, 0);
  const fill = me.reduce((n, x) => n + (x.content.toLowerCase().match(/\b(um+|uh+|erm+|err?|you know|sort of|kind of|basically)\b/g) || []).length, 0);
  const jar = [...new Set(JARGON.filter(j => ptText.some(s => (' ' + s + ' ').includes(j))).map(j => j.trim()))];
  const T = re => { const x = me.find(y => re.test(y.content)); return x ? x.t : null; };
  const ms = {
    'Introduction': T(/my name|i'?m nana|medical student|i'?m one of the/i), 'ID check': T(/date of birth|full name|confirm your name/i), 'Consent': T(/is that (ok|okay|alright|all right)|do you mind|happy for me|would that be ok/i),
    'ICE explored': T(/worr|concern|what do you think|any idea|thoughts on what|hoping|expect/i), 'Summary': T(/summar|recap|just to check|let me check|make sure i'?ve|so far you'?ve/i),
    'Turned to the examiner': toEx.length ? toEx[0].t : null, 'Reasoning sentence': T(/most likely|i think (this|it)|diagnosis|suggests|consistent with|differential/i),
    'Safety-net': T(/come back|999|straight away|a ?(&|and) ?e|urgent|if (it|you|things|the pain)/i), 'Questions invited': T(/any (other )?questions|anything else you'?d like|anything you'?d like to ask/i)
  };
  const target = {'Introduction': 30, 'ID check': 60, 'Consent': 60, 'ICE explored': 420, 'Summary': 450, 'Turned to the examiner': 480, 'Reasoning sentence': 510, 'Safety-net': 590, 'Questions invited': 600};
  const longest = me.reduce((a, x) => Math.max(a, x.dur || 0), 0);

  return {turns: me.length, wMe, wPt, ratio: wMe + wPt ? Math.round(wMe * 100 / (wMe + wPt)) : 0, wpm: spoke > 20 ? Math.round(wMe / (spoke / 60)) : null, open, closed, fill, jar, ms, target, longest: Math.round(longest), barge: VO ? VO.barge : 0, used: Math.max(elapsed(), lastT), voice: cur.mode === 'voice'};
}

  if (t.id === 'qBtn') { const q = $('#q'); q.classList.toggle('show'); if (q.classList.contains('show')) q.focus(); return; }
  if (d.ty && !d.st) return go({v: 'type', id: d.ty});
  if (d.randty) { const l = ST.filter(s => typeOf(s) === d.randty && (s.core || s.pp)); const n = l.filter(s => best(s.id) == null); const p = n.length ? n : l; return go({v: 'station', id: p[Math.floor(Math.random() * p.length)].id}); }
  if (d.rand != null) { const ids = FFP.flatMap(x => x.items.flatMap(it => it.s)); const n = ids.filter(id => best(id) == null); const p = n.length ? n : ids; return go({v: 'station', id: p[Math.floor(Math.random() * p.length)]}); }
  if (d.dgpick != null) { cur.dg = +d.dgpick; if (window.DG) DG.stopAll(); $('#dgWrap').innerHTML = dgCardHtml(cur.st); return; }
  if (d.v) { if (d.v === 'hooks') deck = null; return go({v: d.v}); }
  if (d.go) { if (d.go === 'hooks') deck = null; return go({v: d.go}); }
  if (d.pplist != null) { S.set.grp = 'PP'; S.set.wk = ''; S.set.kind = ''; save(); return go({v: 'stations'}); }
  if (d.st) return go({v: 'station', id: d.st});
  if (d.ex) return go({v: 'exam', id: d.ex});
  if (d.pr) return go({v: 'proc', id: d.pr});
  if (d.u != null && !d.tick) return go({v: 'ilo', id: +d.u});
  if (d.fr) return go({v: 'frame', id: d.fr});
  if (d.fw) return go({v: 'fwone', id: d.fw, mem: d.fwm || ''});
  if (d.randpp != null) { const pool = PPS.filter(s => best(s.id) == null); const l = pool.length ? pool : PPS; return go({v: 'station', id: l[Math.floor(Math.random() * l.length)].id}); }
  if (d.more != null) { const x = t.nextElementSibling; x.hidden = !x.hidden; return; }
  if (d.reveal != null) { t.nextElementSibling.hidden = false; t.remove(); return; }
  if (d.mode) { if (t.disabled) return; return setMode(d.mode); }
  if (d.role) { S.set.role = d.role; save(); drawFriends(); setMode(cur.mode); return; }
  if (d.timer != null) return toggleTimer(t);
  if (d.atlasgo != null) { const q = ($('#atlasQ') || {}).value || ''; return MEV.openAtlas(q.trim() || 'clinical sign', ''); }
  if (d.gong != null) { S.set.beepOff = !S.set.beepOff; save(); t.textContent = S.set.beepOff ? '🔕' : '🔔'; toast(S.set.beepOff ? 'Chimes off' : 'Chimes on: you\'ll hear this at 8:00'); if (!S.set.beepOff) { audioUnlock(); gong(); } return; }
  if (d.treset != null) { stopTimer(); cur.left = 600; drawClock(); $('[data-timer]').textContent = '▶ Start'; return; }
  if (d.send != null) return sendChat();
  if (d.stop != null) return abortChat();
  if (d.qk) { const ta = $('#say'); ta.value = d.qk; ta.focus(); return; }
  if (d.restart != null) { abortChat(); cur.chat = []; $('#chat').innerHTML = ''; $('#aiOut').innerHTML = ''; cur.fb = null; setMode(cur.mode); return; }
  if (d.grade != null) return gradeChat();
  if (d.vstart != null) return vStart();
  if (d.venter != null) return vEnter();
  if (d.vend != null) return endStation(false);
  if (d.vint != null) return vInterrupt();
  if (d.vtgt) { VO.target = d.vtgt; drawVoiceCtl(); return; }
  if (d.vsend != null) { const ta = $('#vSay'), v = ta.value.trim(); if (!v) return; ta.value = ''; if (!VO.on) { toast('Start the station first'); ta.value = v; return; } if (VO.speaking) vInterrupt(); return vSend(v, 0); }
  if (d.vreset != null) { vShutdown(); stopTimer(); cur.left = 600; drawClock(); $('[data-timer]').textContent = '▶ Start'; cur.chat = []; cur.fb = null; $('#vChat').innerHTML = ''; $('#vOut').innerHTML = ''; vInit(); setMode(cur.mode); return; }
  if (d.vagain != null) { if (cur.mode === 'voice') { vShutdown(); vInit(); return vStart(); } abortChat(); cur.chat = []; $('#chat').innerHTML = ''; $('#aiOut').innerHTML = ''; cur.fb = null; stopTimer(); cur.left = 600; drawClock(); setMode(cur.mode); return; }
  if (d.vnewcase != null) { const sel = $('#varSel'); if (sel && cur.st.vars.length > 1) { const ks = cur.st.vars.map(v => v.k).filter(k => k !== cur.vk); sel.value = ks[Math.floor(Math.random() * ks.length)]; sel.dispatchEvent(new Event('change', {bubbles: true})); } if (cur.mode === 'voice') { vInit(); return vStart(); } return; }
  if (d.vtest != null) { if (!TTS) return toast('This browser cannot speak'); if (!VO) vInit(); try { TTS.cancel(); } catch (e) {} const keep = VO.on; VO.on = false; speakQ('Hello doctor, this is how I sound as the patient.', 'pt', true); speakQ('And this is the examiner.', 'ex', true); VO.on = keep; return; }
  if (d.fbspeak != null) return speakFeedback();
  if (d.hview) { S.set.hview = d.hview; save(); return vHooks($('#main')); }
  if (d.saveatt != null) return saveAttempt();
  if (d.savefr != null) return saveFriends();
  if (d.clear != null) { cur.ticks.clear(); $$('[data-tick]').forEach(cb => { cb.checked = false; cb.closest('.it').classList.remove('ai', 'miss'); }); updScore(); return; }
  if (d.expand != null) { const ds = $$('.sec'); const any = ds.some(x => !x.open); ds.forEach(x => x.open = any); t.textContent = any ? 'Close all' : 'Open all'; return; }
  if (d.hshow != null) { deck.shown = true; return vHooks($('#main')); }
  if (d.hskip != null) { deck.i++; deck.shown = false; return vHooks($('#main')); }
  if (d.hk) { const c = deck.cards[deck.i], r = S.hk[c.id] = S.hk[c.id] || {ok: 0, a: 0}; r[d.hk]++; r.ts = Date.now(); save(); if (d.hk === 'a') deck.cards.splice(Math.min(deck.cards.length, deck.i + 4), 0, c); deck.i++; deck.shown = false; return vHooks($('#main')); }
  if (d.hrestart != null) { buildDeck(); return vHooks($('#main')); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.dgtest != null) { S.set.dgtest = t.checked; save(); document.body.classList.toggle('dg-testing', !!S.set.dgtest); return; }
  if (t.dataset && t.dataset.tick) { t.checked ? cur.ticks.add(t.dataset.tick) : cur.ticks.delete(t.dataset.tick); updScore(); return; }
  if (t.dataset && t.dataset.lik != null) { cur.lik[t.dataset.lik] = t.value === '' ? null : +t.value; updFriends(); return; }
  if (t.id === 'varSel') { const st = cur.st; if (VO && (VO.on || VO.phase === 'read')) { vShutdown(); vInit(); stopTimer(); cur.left = 600; drawClock(); } cur.chat = []; cur.fb = null; const vc = $('#vChat'); if (vc) vc.innerHTML = ''; const vo = $('#vOut'); if (vo) vo.innerHTML = ''; if (t.value === '?') { cur.hidden = true; cur.vk = st.vars[Math.floor(Math.random() * st.vars.length)].k; } else { cur.hidden = false; cur.vk = t.value; } cur.lik = {}; drawStationParts(); setMode(cur.mode); return; }
  if (t.id === 'fwMem') { route.mem = t.value; try { history.replaceState(null, '', '#' + toHash(route)); } catch (e) {} return vFwOne($('#main')); }
  if (t.id === 'fwOnly') { S.set.fwOnly = t.checked; save(); return vFwOne($('#main')); }
  if (t.id === 'vPttSel') { S.set.vPtt = t.value === 'ptt'; save(); vStopRec(); drawVoiceCtl(); return vListen(); }
  if (t.id === 'vPauseSel') { S.set.vPause = +t.value; return save(); }
  if (t.id === 'vReadSel') { S.set.vRead = t.value !== 'skip'; return save(); }
  if (t.id === 'vPtSel') { S.set.vPt = t.value; return save(); }
  if (t.id === 'vExSel') { S.set.vEx = t.value; return save(); }
  if (t.id === 'vRateSel') { S.set.vRate = t.value; return save(); }
  if (t.id === 'vTierSel') { S.set.markTier = t.value; return save(); }
  if (t.id === 'vMuteT') { S.set.vMute = t.checked; save(); if (t.checked) vInterrupt(); return; }
  if (t.id === 'vPromptT') { S.set.vPrompts = t.checked; return save(); }
  if (t.id === 'vBeepT') { S.set.beepOff = !t.checked; return save(); }
  if (t.id === 'recallT') { S.set.recall = t.checked; save(); $('#scriptCard').innerHTML = scriptHtml(cur.st, cur.hidden ? '~' : cur.vk); return; }
  if (t.id === 'hDeck' || t.id === 'hWk') { S.set.deck = $('#hDeck').value; S.set.hwk = $('#hWk').value; save(); deck = null; return vHooks($('#main')); }
  if (t.id === 'fwJump' && t.value) { const [fid, mid] = t.value.split('--'); return go({v: 'fwone', id: fid, mem: mid || ''}); }
  if ((t.id === 'fwSys' || t.id === 'iSys') && (t.value || t.id === 'iSys')) { S.set.sys = t.value; if (t.id === 'fwSys') { S.set.grp = ''; S.set.wk = ''; S.set.kind = ''; } save(); return t.id === 'iSys' ? vIlos($('#main')) : go({v: 'stations'}); }
  if (['fSys', 'fGrp', 'fWk', 'fKind', 'fDone'].includes(t.id)) { S.set.sys = $('#fSys').value; S.set.grp = $('#fGrp').value; S.set.wk = $('#fWk').value; S.set.kind = $('#fKind').value; save(); drawStList(); }
});
document.addEventListener('keydown', e => {
  if (e.target.id === 'say' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
  if (e.target.id === 'vSay' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); const b = $('[data-vsend]'); if (b) b.click(); }
  if (e.code === 'Space' && !e.repeat && cur && cur.mode === 'voice' && VO && VO.on && S.set.vPtt && !/^(TEXTAREA|INPUT|SELECT|BUTTON)$/.test(e.target.tagName)) { e.preventDefault(); pttDown(); }
});
document.addEventListener('keyup', e => { if (e.code === 'Space' && cur && cur.mode === 'voice' && VO && VO.holding && !/^(TEXTAREA|INPUT|SELECT)$/.test(e.target.tagName)) { e.preventDefault(); pttUp(); } });
function pttDown(){ if (!VO || !VO.on || !VO.rec) return; if (VO.speaking) vInterrupt(); VO.holding = true; VO.pttUp = false; VO.buf = ''; VO.interim = ''; VO.segStart = Date.now(); const b = $('[data-vptt]'); if (b) b.classList.add('on'); setOrb('listening', 'Listening while you hold…'); try { VO.rec.start(); } catch (e) {} }
function pttUp(){ if (!VO || !VO.holding) return; VO.holding = false; const b = $('[data-vptt]'); if (b) b.classList.remove('on'); if (VO.recOn) { VO.pttUp = true; try { VO.rec.stop(); } catch (e) { vCommit(); } } else vCommit(); }
document.addEventListener('pointerdown', e => { const b = e.target.closest && e.target.closest('[data-vptt]'); if (b) { e.preventDefault(); pttDown(); } });
document.addEventListener('pointerup', () => { if (VO && VO.holding) pttUp(); });
document.addEventListener('pointercancel', () => { if (VO && VO.holding) pttUp(); });
document.addEventListener('input', e => { if (e.target.id === 'rfQ') { S.set.rfq = e.target.value; clearTimeout(vRf.t); vRf.t = setTimeout(() => { save(); $('#rfList').innerHTML = rfListHtml(e.target.value.toLowerCase().trim()); }, 180); return; } if (e.target.id === 'tQ') { S.set['tq_' + route.id] = e.target.value; clearTimeout(vType.t); vType.t = setTimeout(() => { save(); const k = route.id, q = e.target.value.toLowerCase().trim(); const L = ST.filter(s => typeOf(s) === k && (!q || q.split(/\s+/).every(w => (s.t + ' ' + (s.sub || '') + ' ' + (s.ffp || '') + ' ' + s.id + ' ' + (s.u || []).map(i => UNITS[i] ? UNITS[i].name : '').join(' ')).toLowerCase().includes(w)))); $('#tList').innerHTML = typeListHtml(k, L, !!q); }, 180); return; } if (e.target.id === 'hQ') { S.set.hq = e.target.value; clearTimeout(vHooks.t); vHooks.t = setTimeout(() => { const r = allHooksHtml(); $('#hAll').innerHTML = r.h; $('#hN').textContent = r.n + ' cards'; }, 200); } });
if (matchMedia('(max-width:620px)').matches) $('#qBtn').style.display = '';
route = fromHash(); render();
</script>
